version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: escalation_db
    environment:
      POSTGRES_USER: escalation_user
      POSTGRES_PASSWORD: escalation_pass
      POSTGRES_DB: escalation_tracker
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U escalation_user -d escalation_tracker"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: escalation_redis
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: escalation_backend
    environment:
      - DATABASE_URL=postgresql://escalation_user:escalation_pass@db:5432/escalation_tracker
      - REDIS_URL=redis://redis:6379/0
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - ./backend/.env

volumes:
  postgres_data:
  redis_data:
